name: BarberPOSiOS
options:
  bundleIdPrefix: vn.barberpos
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  BarberPOSiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - path: ../shared-spec/theme-presets.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.barberpos.ios
        MARKETING_VERSION: 0.9.11
        CURRENT_PROJECT_VERSION: 37
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SÓI BarberPOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAlarmKitUsageDescription: Báo hết giờ cho các công đoạn hóa chất tại tiệm.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  BarberPOSiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BarberPOSiOS
schemes:
  BarberPOSiOS:
    build:
      targets:
        BarberPOSiOS: all
    test:
      targets: [BarberPOSiOSTests]
